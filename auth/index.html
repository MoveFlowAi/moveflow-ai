<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoveFlow AI | Company Login</title><style>body{margin:0;background:#08152a;color:#eaf2ff;font:16px system-ui,Arial}.wrap{max-width:950px;margin:45px auto;padding:20px}.panel{background:#122541;border:1px solid #2b4b76;border-radius:18px;padding:25px;margin:18px 0}h1{font-size:32px}input,button,select,textarea{font:inherit;padding:13px;border-radius:9px;border:1px solid #42618a;box-sizing:border-box}input,select,textarea{background:#07162b;color:white;width:100%;margin:7px 0 14px}button{background:#1674ef;color:white;cursor:pointer;border:0;margin:5px 8px 5px 0}a{color:#77b9ff}.muted{color:#9fb4d1}.lead{border-bottom:1px solid #385373;padding:12px 0}label{display:block}#msg{white-space:pre-wrap}</style><main class="wrap"><a href="../">← MoveFlow AI</a><h1>Company sign in</h1><p class="muted">Sign in to manage your moving leads. New companies can create an account, then request activation.</p><section class="panel"><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6"></label><button id="login">Sign in</button><button id="signup">Create account</button><p id="msg" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const db=window.supabase.createClient("https://jmatopczikrdrooxrtfy.supabase.co","sb_publishable_WjZJSwlmYht2djHcrSsV-w_S0Rbg1yU");function say(s){document.getElementById('msg').textContent=s}</script><script>
const emailField=document.getElementById('email');
const passwordField=document.getElementById('password');
function credentials(){
 const email=emailField.value.trim();
 const password=passwordField.value;
 if(!email||!emailField.checkValidity()){say('Please enter a valid email address.');return null}
 if(!password||password.length<6){say('Please enter a password with at least 6 characters.');return null}
 return {email,password};
}
document.getElementById('login').onclick=async()=>{
 const details=credentials();if(!details)return;
 say('Signing in…');
 try{const {error}=await db.auth.signInWithPassword(details);
 if(error)return say(error.message);
 location.href='../dashboard/';}catch(e){say('Connection error: '+e.message)}
};
document.getElementById('signup').onclick=async()=>{
 const details=credentials();if(!details)return;
 say('Creating account…');
 try{const {error}=await db.auth.signUp({...details,options:{emailRedirectTo:location.origin+'/moveflow-ai/auth/'}});
 say(error?error.message:'Check your email to confirm your account. Company access must be approved before leads appear.');}catch(e){say('Connection error: '+e.message)}
};
db.auth.getSession().then(({data})=>{if(data.session)location.href='../dashboard/'});
</script></html>
