<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoveFlow AI | Register your company</title><style>:root{font-family:Inter,system-ui,Arial;color:#152744;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:600px;margin:55px auto;padding:18px}a{color:#256ce6}.card{background:white;border:1px solid #dfe8f3;border-radius:18px;padding:32px;box-shadow:0 18px 45px #142b4912}h1{margin:8px 0 10px;font-size:30px}p{color:#667994;line-height:1.6}label{display:block;margin:18px 0 5px;font-weight:650}input{width:100%;border:1px solid #cbd9eb;border-radius:10px;padding:13px;font:inherit}button{width:100%;margin-top:22px;background:#246cf0;border:0;border-radius:10px;padding:14px;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}#msg{white-space:pre-wrap}.hint{font-size:13px}</style></head><body><main class="wrap"><a href="../">← MoveFlow AI</a><section class="card"><h1>Set up your moving company</h1><p>Register your business to prepare a private workspace. We'll review new companies before activating their quote links.</p><form id="form"><label for="name">Company name</label><input id="name" required minlength="2" maxlength="120" placeholder="Example Moving Co."><label for="slug">Company link name</label><input id="slug" required minlength="3" maxlength="60" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="example-moving"><p class="hint">Lowercase letters, numbers and hyphens only.</p><label for="zip">Primary service ZIP code</label><input id="zip" required inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="20715"><button id="submit">Register company</button><p id="msg" role="status" aria-live="polite"></p></form><p class="hint">Already registered? <a href="../dashboard/">Go to dashboard</a>. Need an account? <a href="../auth/">Sign up or sign in</a>.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const db=window.supabase.createClient("https://jmatopczikrdrooxrtfy.supabase.co","sb_publishable_WjZJSwlmYht2djHcrSsV-w_S0Rbg1yU");const form=document.getElementById("form"),msg=document.getElementById("msg"),btn=document.getElementById("submit");document.getElementById("name").addEventListener("input",e=>{const s=document.getElementById("slug");if(!s.dataset.edited)s.value=e.target.value.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)});document.getElementById("slug").addEventListener("input",e=>e.target.dataset.edited="yes");db.auth.getUser().then(({data})=>{if(!data.user){location.href="../auth/?next=onboarding";return}if(!data.user.email_confirmed_at)msg.textContent="Please verify your email before registering."});form.addEventListener("submit",async e=>{e.preventDefault();if(!form.reportValidity())return;btn.disabled=true;msg.textContent="Registering your company…";try{const {data:{user}}=await db.auth.getUser();if(!user){location.href="../auth/?next=onboarding";return}const {error}=await db.rpc("register_moving_company",{p_name:document.getElementById("name").value.trim(),p_slug:document.getElementById("slug").value.trim(),p_zip:document.getElementById("zip").value.trim()});if(error)throw error;msg.textContent="Company registered. Your workspace is ready for setup, but your quote link will stay inactive until approved.";setTimeout(()=>location.href="../dashboard/",1800)}catch(err){msg.textContent="Registration couldn't be completed: "+(err.message||"Try again later.")}finally{btn.disabled=false}});</script></body></html>
