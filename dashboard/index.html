<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoveFlow AI | Private Dashboard</title><style>body{margin:0;background:#08152a;color:#eaf2ff;font:16px system-ui,Arial}.wrap{max-width:950px;margin:45px auto;padding:20px}.panel{background:#122541;border:1px solid #2b4b76;border-radius:18px;padding:25px;margin:18px 0}h1{font-size:32px}input,button,select,textarea{font:inherit;padding:13px;border-radius:9px;border:1px solid #42618a;box-sizing:border-box}input,select,textarea{background:#07162b;color:white;width:100%;margin:7px 0 14px}button{background:#1674ef;color:white;cursor:pointer;border:0;margin:5px 8px 5px 0}a{color:#77b9ff}.muted{color:#9fb4d1}.lead{border-bottom:1px solid #385373;padding:12px 0}label{display:block}#msg{white-space:pre-wrap}</style><main class="wrap"><a href="../">← MoveFlow AI</a><h1>Your private lead dashboard</h1><p id="identity" class="muted">Checking sign-in…</p><button id="logout">Sign out</button><section class="panel"><h2>Your companies</h2><div id="companies"></div></section><section class="panel"><h2>Recent leads</h2><div id="leads"></div><p id="msg" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const db=window.supabase.createClient("https://jmatopczikrdrooxrtfy.supabase.co","sb_publishable_WjZJSwlmYht2djHcrSsV-w_S0Rbg1yU");function say(s){document.getElementById('msg').textContent=s}</script><script>document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='../auth/'};async function load(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='../auth/';return}document.getElementById('identity').textContent=user.email;const c=await db.from('companies').select('id,name,slug').order('name');if(c.error)return say(c.error.message);document.getElementById('companies').textContent=c.data.length?c.data.map(x=>x.name+' — '+location.origin+'/moveflow-ai/quote/?company='+encodeURIComponent(x.slug)).join('\n'):'No company assigned yet. Contact MoveFlow AI to activate your company.';document.getElementById('companies').style.whiteSpace='pre-wrap';const l=await db.from('leads').select('id,company_id,customer_name,customer_email,pickup_zip,destination_zip,move_date,status,created_at').order('created_at',{ascending:false}).limit(100);if(l.error)return say(l.error.message);document.getElementById('leads').textContent='';for(const x of l.data){const div=document.createElement('div');div.className='lead';div.textContent=x.customer_name+' | '+x.pickup_zip+' → '+(x.destination_zip||'Unknown')+' | '+x.status+' | '+x.customer_email;document.getElementById('leads').append(div)}if(!l.data.length)say('No leads yet. New assigned leads will appear here.')};load()</script></html>
