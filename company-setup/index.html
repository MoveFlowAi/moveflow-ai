<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoveFlow AI | Company Setup</title><style>body{background:#09162b;color:#eaf2ff;font:16px system-ui;margin:0}.wrap{max-width:650px;margin:50px auto;padding:24px}.panel{padding:28px;background:#142642;border:1px solid #2c4772;border-radius:18px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:9px 0 20px;border-radius:9px;font:inherit}input{background:#071426;color:white;border:1px solid #50688b}button{background:#1579f2;border:0;color:white;cursor:pointer}a{color:#7cb9ff}</style><main class="wrap"><a href="../dashboard/">← Dashboard</a><h1>Register your moving company</h1><section class="panel"><p>New companies must be reviewed before they can receive leads.</p><label>Company name<input id="name" maxlength="120" placeholder="Example Moving LLC"></label><label>Company link name<input id="slug" maxlength="60" placeholder="example-moving"></label><button id="create">Request company account</button><p id="msg" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const db=window.supabase.createClient("https://jmatopczikrdrooxrtfy.supabase.co","sb_publishable_WjZJSwlmYht2djHcrSsV-w_S0Rbg1yU");document.getElementById('create').onclick=async()=>{const msg=document.getElementById('msg');const name=document.getElementById('name').value.trim(),slug=document.getElementById('slug').value.trim().toLowerCase();if(name.length<2||!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)){msg.textContent='Enter a company name and a link name using lowercase letters, numbers and hyphens.';return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='../auth/';return}const {error}=await db.rpc('register_moving_company',{p_name:name,p_slug:slug});msg.textContent=error?error.message:'Company account requested. Approval is required before lead routing is activated.'};</script></html>
